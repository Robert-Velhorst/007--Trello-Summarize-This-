services:
  proxy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to a public DNS hostname}
    volumes:
      - ./deployment/hetzner/Caddyfile:/etc/caddy/Caddyfile:ro
      - summarize-this-caddy-data:/data
      - summarize-this-caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  summarize-this-caddy-data:
  summarize-this-caddy-config:
