services:
  database:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: summarize_this
      POSTGRES_USER: summarize_this
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    shm_size: 64mb
    volumes:
      - summarize-this-postgres-v18:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summarize_this -d summarize_this"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

  backend:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - edge
      - data
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      BACKEND_STORE: postgres
      DATABASE_URL: postgresql://summarize_this:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}@database:5432/summarize_this
      DB_POOL_MAX: ${DB_POOL_MAX:-4}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-closed}
      BACKEND_ALLOWED_ORIGINS: ${BACKEND_ALLOWED_ORIGINS:-http://127.0.0.1:17117,http://localhost:17117}
      TRELLO_APP_KEY: ${TRELLO_APP_KEY:-}
      RUN_WORKER: "true"
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-5000}
      HAI_CONNECTOR_ENABLED: ${HAI_CONNECTOR_ENABLED:-false}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - summarize-this-data:/app/database/runtime
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  summarize-this-data:
  summarize-this-postgres-v18:

networks:
  edge:
  data:
    internal: true
